[project]
title = 'San Andreas Unity Mobile Port'
slug = 'san-andreas-unity-mobile-port'
engine = 'unity'
platform = 'native-mobile'
version = '0.1.0-mobile'

[build]
dir = '../../build/WebGL'

[controller]
mode = 'action-map'

[[controller.controls]]
id = 'move'
type = 'joystick'
x = 0.23
y = 0.77
w = 0.3
h = 0.3
up = 'move_up'
down = 'move_down'
left = 'move_left'
right = 'move_right'
deadzone = 0.18
sensitivity = 1.0
repeat_hz = 60

[[controller.controls]]
id = 'aim'
type = 'joystick'
x = 0.77
y = 0.77
w = 0.3
h = 0.3
up = 'aim_up'
down = 'aim_down'
left = 'aim_left'
right = 'aim_right'
deadzone = 0.12
sensitivity = 1.25
repeat_hz = 90

[[controller.controls]]
id = 'fire'
type = 'button'
x = 0.84
y = 0.56
w = 0.13
h = 0.13
action = 'fire'

[[controller.controls]]
id = 'jump'
type = 'button'
x = 0.89
y = 0.73
w = 0.13
h = 0.13
action = 'jump'

[[controller.controls]]
id = 'aim-button'
type = 'button'
x = 0.76
y = 0.65
w = 0.13
h = 0.13
action = 'aim'
